# One-click WheelDeal WhatsApp backend on Render's free tier.
#
# Render reads this Blueprint, builds the Evolution API image from
# deploy/evolution/Dockerfile, provisions a FREE Postgres database, and wires the
# database connection string into Evolution automatically - so there is NO
# database password to copy by hand (the #1 thing that broke the manual VM
# attempts). After it deploys, copy the service URL and paste it into the app at
# Owner -> Keys -> EVOLUTION_HOSTS as:  https://<service>.onrender.com|<API key>
#
# Honest free-tier limits: the web service sleeps after ~15 min idle (use the
# keep-awake cron on /api/wa/ping to wake it), has 512 MB RAM (fine for an MVP /
# a handful of live sessions), and the free Postgres expires after ~30 days
# (recreate it, or upgrade the DB to the ~$7/mo plan when you launch for real).

databases:
  - name: wd-evo-db
    plan: free
    region: oregon
    databaseName: evolution

services:
  - type: web
    name: wd-evolution
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/evolution/Dockerfile
    dockerContext: ./deploy/evolution
    healthCheckPath: /
    envVars:
      # Evolution listens on 8080; tell Render to route + health-check that port
      # (otherwise Render probes its default 10000, sees nothing, and fails).
      - key: PORT
        value: "8080"
      - key: SERVER_PORT
        value: "8080"
      - key: AUTHENTICATION_API_KEY
        value: wd-pool-9x7k2mQ4pL8vT1nR
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        fromDatabase:
          name: wd-evo-db
          property: connectionString
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      - key: DATABASE_SAVE_DATA_MESSAGE_UPDATE
        value: "true"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "true"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "true"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: WheelDeal
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome
      # ---- Throughput / load tuning (New#9: handle many concurrent sessions) --
      # Quieter logs = less CPU/IO under load.
      - key: LOG_LEVEL
        value: "ERROR"
      - key: LOG_BAILEYS
        value: "error"
      # We consume events via HTTP webhooks, not the socket API - turning the
      # websocket server off frees memory per connection.
      - key: WEBSOCKET_ENABLED
        value: "false"
      # Don't sync the full contact book (heavy); chats + messages are enough
      # for the funnel and for teaching from named numbers.
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "false"
      # Many instances on one process => raise the emitter ceiling so Node does
      # not warn/leak under a few hundred live sessions.
      - key: EVENT_EMITTER_MAX_LISTENERS
        value: "500"
      # Reuse one Baileys store cache across instances.
      - key: CACHE_LOCAL_ENABLED
        value: "true"

# ---------------------------------------------------------------------------
# SCALING TO HUNDREDS OF CONCURRENT SESSIONS
# ---------------------------------------------------------------------------
# The app already spreads users across a POOL of Evolution hosts (Owner ->
# Keys -> EVOLUTION_HOSTS, one url|key per line) and fails over automatically,
# so horizontal scale = add more hosts. To go big on ONE deployment:
#   1. Bump this service `plan: free` -> `standard` (2 GB+ RAM) - a 512 MB free
#      instance comfortably holds ~30-50 live WhatsApp sockets; a 2 GB standard
#      instance holds a few hundred.
#   2. Add a shared Redis so multiple instances coordinate (set
#      CACHE_REDIS_ENABLED=true, CACHE_REDIS_URI=<render key-value url>), then
#      raise `numInstances` for the web service.
#   3. Upgrade the free Postgres (expires ~30 days) to the paid DB plan.
# Do NOT try to push more raw throughput than the anti-ban engine allows - the
# per-number caps are the real limit that keeps every user's number safe.
