# WheelDeal on one free-tier GCE VM (1GB RAM budget).
#   redis   ~150MB (maxmemory 160mb, AOF persisted)  - queues + hot state
#   gateway ~80MB                                     - webhook ingress (<200ms ack)
#   workers ~200MB                                    - all five BullMQ consumers
# OWNER RULE R1: the Next.js frontend runs as a separate Cloud Run service
# (root Dockerfile) - no web service ever runs on this VM. The VM is strictly
# gateway + workers + redis (~450MB, comfortable headroom on 1GB).
# DB + storage stay on SUPABASE (external, free) - nothing DB-shaped runs here.
#
# Usage (on the VM):  docker compose --env-file .env up -d --build
# .env carries: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_DB_URL
# (Supavisor pooled, port 6543), SESSION_SECRET, ADMIN_EMAILS, provider keys.

services:
  redis:
    image: redis:7-alpine
    # OWNER RULE R2: no-appendfsync-on-rewrite - during an AOF rewrite, skip
    # fsync so a background rewrite can never saturate the GCE standard
    # persistent disk's IOPS and stall the gateway's <200ms webhook ACK path.
    # (Trade-off: up to ~30s of writes at risk ONLY during a rewrite window -
    # acceptable; every queue consumer is idempotent by design.)
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--no-appendfsync-on-rewrite", "yes",
        "--maxmemory", "160mb",
        "--maxmemory-policy", "noeviction",
      ]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.gateway
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      SERVICE_NAME: gateway
      GATEWAY_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  workers:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.workers
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      SERVICE_NAME: workers
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
