# WheelDeal gateway reverse proxy. Terminates the public :80/:443 and forwards
# to the Express gateway on 127.0.0.1:8080. certbot --nginx rewrites this to add
# the TLS server block + the :80->:443 redirect once DNS points at the VM.
#
# __API_DOMAIN__ is replaced by the startup script from APP_DOMAIN.
server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    # The Evolution webhook ingress + health, and the SSE stream.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/api/stream/:searchId): stream deltas, never buffer. The app
        # already sends X-Accel-Buffering:no; make nginx honor long-lived
        # connections too.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }
}
