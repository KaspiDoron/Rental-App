# Mirror the Evolution WhatsApp image into THIS repo's GitHub Container Registry,
# so hosting platforms (Render, etc.) can pull it from ghcr.io instead of Docker
# Hub. Docker Hub rate-limits anonymous pulls from shared cloud IPs (which breaks
# free-tier deploys); ghcr.io does not. GitHub-hosted runners can pull from Docker
# Hub without that limit, so this copy step is reliable.
#
# Runs automatically when this file changes, and can be re-run any time from the
# Actions tab (Run workflow). After it succeeds once, make the resulting package
# public (GitHub -> your packages -> evolution-api -> Package settings -> Public).
name: Mirror Evolution image to GHCR

on:
  workflow_dispatch:
  push:
    branches: [claude/rental-negotiation-app-pc33ux]
    paths: ['.github/workflows/mirror-evolution.yml']

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Lowercase owner
        id: o
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Copy atendai/evolution-api:v2.1.1 -> ghcr.io
        run: |
          set -eux
          SRC="atendai/evolution-api:v2.1.1"
          DST="ghcr.io/${{ steps.o.outputs.owner }}/evolution-api:v2.1.1"
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"
          echo "Pushed $DST"
